[package]
name = "code-signer"
version = "0.1.0"
edition = "2021"
description = "Windows Authenticode 程式碼簽章工具（GUI + CLI）"
license = "MIT"
repository = "https://github.com/tntrock/code-signer"
build = "build.rs"
publish = false

[lib]
name = "code_signer"
path = "src/lib.rs"

[[bin]]
name = "code-signer"
path = "src/main.rs"

[dependencies]
# ---- GUI ----
eframe = "0.36"
rfd = "0.17"

# ---- CLI ----
clap = { version = "4.6", features = ["string"] }
rpassword = "7"

# ---- 憑證產生（純 Rust）----
rsa = "0.9"
rcgen = "0.14"
p12-keystore = "0.3"
x509-parser = "0.18"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }

# ---- 共用 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

# ---- Win32（簽章、驗證、憑證存放區）----
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Console",
]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# 開發/測試時也最佳化相依套件：RSA 金鑰產生在未最佳化時非常慢
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
